<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TinTinChat Offline</title>
  <meta name="theme-color" content="#6a11cb" />
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Segoe UI,Arial,sans-serif; background:#f0f2f5; color:#1c1e21; }
    .card { max-width:28rem; margin:1rem; padding:1rem 1.25rem; border-radius:16px; background:#fff; border:1px solid #e4e6eb; box-shadow:0 8px 25px rgba(0,0,0,.08); }
    h1 { margin:.25rem 0 .6rem; font-size:1.2rem; }
    p { margin:.35rem 0; color:#65676b; }
    button { margin-top:.8rem; border:0; border-radius:999px; padding:.5rem .9rem; color:#fff; background:linear-gradient(135deg,#6a11cb,#2575fc); cursor:pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>TinTinChat could not reach the network.</p>
    <p>Reconnect and retry to continue messaging.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
